name: Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'source/**'
      - 'assets/**'
      - 'example_mods/**'
      - 'Project.xml'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/Android.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK and NDK
        run: sdkmanager 'platforms;android-33' 'build-tools;33.0.2' 'ndk;25.2.9519653'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Install pinned Haxe dependencies
        run: bash scripts/setup-android.sh
      - name: Test packaged assets
        run: |
          python3 tests/android-assets.py
          python3 tests/mobile-controls.py
      - name: Configure Lime
        run: |
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_HOME/ndk/25.2.9519653"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"
      - name: Build installable ARM64 APK
        env:
          ANDROID_GRADLE_TASK: assembleDebug
          ANDROID_HOST: linux-x86_64
        run: |
          # SScript class metadata requires more than the default compiler stack.
          ulimit -s 65536
          export PATH="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/$ANDROID_HOST/bin:$PATH"
          export HXCPP_STRIP="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/$ANDROID_HOST/bin/llvm-strip"
          clang++ --version
          haxelib run lime build android -D HXCPP_ARM64 -D HXCPP_M64
      - name: Validate and stage APK
        run: |
          apk=export/release/android/bin/app/build/outputs/apk/debug/TwiddleFinger-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/33.0.2/apksigner" verify "$apk"
          mkdir -p dist
          cp "$apk" dist/TwiddleFinger-android-arm64.apk
      # Releases expose the actual APK. Actions artifacts would download as ZIP.
      - name: Publish direct APK download
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" dist/TwiddleFinger-android-arm64.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "TwiddleFinger Android ${GITHUB_RUN_NUMBER}" \
            --notes 'APK de teste ARM64. Baixe TwiddleFinger-android-arm64.apk em Assets. Assinatura de teste: versões de execuções diferentes podem exigir desinstalar a anterior.'
          echo "Download direto: https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/TwiddleFinger-android-arm64.apk" >> "$GITHUB_STEP_SUMMARY"
